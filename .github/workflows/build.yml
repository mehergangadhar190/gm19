name: GM Manager - Complete APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          rm -rf gmmanager
          flutter create \
            --platforms=android \
            --project-name=gmmanager \
            --org=com.gmmanager \
            gmmanager

      - name: Configure GM Manager
        run: |
          cat > gmmanager/pubspec.yaml <<'EOF'
          name: gmmanager
          description: GM Manager - Personal AI and Social Media Manager
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            image_picker: ^1.1.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          rm -rf gmmanager/test

      - name: Install GM Manager code
        run: |
          cat > gmmanager/lib/main.dart <<'DART'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:image_picker/image_picker.dart';

          void main() {
            runApp(const GMManager());
          }

          const gmGreen = Color(0xFF16A34A);
          const gmDark = Color(0xFF07130B);

          class GMManager extends StatelessWidget {
            const GMManager({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'GM Manager',
                theme: ThemeData(
                  useMaterial3: true,
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: gmDark,
                  colorScheme: ColorScheme.fromSeed(
                    seedColor: gmGreen,
                    brightness: Brightness.dark,
                  ),
                  cardTheme: CardThemeData(
                    elevation: 0,
                    margin: EdgeInsets.zero,
                    shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(18),
                    ),
                  ),
                ),
                home: const GMHome(),
              );
            }
          }

          class GMHome extends StatefulWidget {
            const GMHome({super.key});

            @override
            State<GMHome> createState() => _GMHomeState();
          }

          class _GMHomeState extends State<GMHome> {
            int selected = 0;

            final pages = const [
              DashboardPage(),
              ContentPage(),
              AssistantPage(),
              ToolsPage(),
              SettingsPage(),
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: IndexedStack(
                    index: selected,
                    children: pages,
                  ),
                ),
                bottomNavigationBar: NavigationBar(
                  selectedIndex: selected,
                  onDestinationSelected: (i) {
                    setState(() => selected = i);
                  },
                  destinations: const [
                    NavigationDestination(
                      icon: Icon(Icons.home_outlined),
                      selectedIcon: Icon(Icons.home),
                      label: 'Home',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.grid_view_outlined),
                      selectedIcon: Icon(Icons.grid_view),
                      label: 'Content',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.auto_awesome_outlined),
                      selectedIcon: Icon(Icons.auto_awesome),
                      label: 'GM AI',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.tune_outlined),
                      selectedIcon: Icon(Icons.tune),
                      label: 'Tools',
                    ),
                    NavigationDestination(
                      icon: Icon(Icons.settings_outlined),
                      selectedIcon: Icon(Icons.settings),
                      label: 'Settings',
                    ),
                  ],
                ),
              );
            }
          }

          // ============================================================
          // DASHBOARD
          // ============================================================

          class DashboardPage extends StatelessWidget {
            const DashboardPage({super.key});

            @override
            Widget build(BuildContext context) {
              return CustomScrollView(
                slivers: [
                  const SliverAppBar.large(
                    title: Text(
                      'GM Manager',
                      style: TextStyle(fontWeight: FontWeight.bold),
                    ),
                  ),
                  SliverPadding(
                    padding: const EdgeInsets.all(16),
                    sliver: SliverList(
                      delegate: SliverChildListDelegate([
                        _welcome(),
                        const SizedBox(height: 20),
                        const Text(
                          "Today's Recommendation",
                          style: TextStyle(
                            fontSize: 21,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 10),
                        _recommendation(),
                        const SizedBox(height: 24),
                        const Text(
                          'GM Features',
                          style: TextStyle(
                            fontSize: 21,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 12),
                        _features(context),
                        const SizedBox(height: 24),
                        const Text(
                          'What GM Can Decide',
                          style: TextStyle(
                            fontSize: 21,
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                        const SizedBox(height: 12),
                        _decision('Best photo', Icons.photo),
                        _decision(
                          'Natural pose suggestion',
                          Icons.accessibility_new,
                        ),
                        _decision('Aesthetic recommendation', Icons.palette),
                        _decision('Music suggestion', Icons.music_note),
                        _decision('Caption writing', Icons.edit),
                        _decision('Best posting time', Icons.schedule),
                        const SizedBox(height: 20),
                        Card(
                          child: Padding(
                            padding: const EdgeInsets.all(18),
                            child: Row(
                              children: const [
                                Icon(
                                  Icons.verified_user,
                                  color: gmGreen,
                                  size: 28,
                                ),
                                SizedBox(width: 12),
                                Expanded(
                                  child: Text(
                                    'GM keeps your look natural. '
                                    'No face or body-structure changes.',
                                  ),
                                ),
                              ],
                            ),
                          ),
                        ),
                      ]),
                    ),
                  ),
                ],
              );
            }

            Widget _welcome() {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(20),
                  child: Row(
                    children: const [
                      CircleAvatar(
                        radius: 32,
                        backgroundColor: gmGreen,
                        child: Icon(
                          Icons.auto_awesome,
                          color: Colors.white,
                          size: 32,
                        ),
                      ),
                      SizedBox(width: 15),
                      Expanded(
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text(
                              'Welcome to GM',
                              style: TextStyle(
                                fontSize: 24,
                                fontWeight: FontWeight.bold,
                              ),
                            ),
                            SizedBox(height: 5),
                            Text(
                              'Your personal AI photographer, '
                              'stylist and social-media manager.',
                            ),
                          ],
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _recommendation() {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(18),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Row(
                        children: [
                          Icon(Icons.auto_awesome, color: gmGreen),
                          SizedBox(width: 8),
                          Text(
                            'GM Suggests',
                            style: TextStyle(
                              fontWeight: FontWeight.bold,
                              fontSize: 17,
                            ),
                          ),
                        ],
                      ),
                      SizedBox(height: 12),
                      Text(
                        'Create a clean natural post today. '
                        'Use your strongest photo, keep the edit subtle, '
                        'and use a short personal caption.',
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _features(BuildContext context) {
              final list = [
                ('Photo Studio', Icons.photo_camera),
                ('Planner', Icons.calendar_month),
                ('Analytics', Icons.analytics),
                ('Approval', Icons.check_circle),
                ('Stories & Collage', Icons.auto_stories),
                ('Highlights', Icons.star),
              ];

              return GridView.builder(
                shrinkWrap: true,
                physics: const NeverScrollableScrollPhysics(),
                itemCount: list.length,
                gridDelegate:
                    const SliverGridDelegateWithFixedCrossAxisCount(
                  crossAxisCount: 2,
                  crossAxisSpacing: 12,
                  mainAxisSpacing: 12,
                  childAspectRatio: 1.25,
                ),
                itemBuilder: (context, i) {
                  return Card(
                    child: InkWell(
                      borderRadius: BorderRadius.circular(18),
                      onTap: () {
                        Navigator.push(
                          context,
                          MaterialPageRoute(
                            builder: (_) => FeaturePage(
                              title: list[i].$1,
                              icon: list[i].$2,
                            ),
                          ),
                        );
                      },
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Icon(list[i].$2, size: 32),
                          const SizedBox(height: 10),
                          Text(
                            list[i].$1,
                            textAlign: TextAlign.center,
                            style: const TextStyle(
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            Widget _decision(String text, IconData icon) {
              return Card(
                margin: const EdgeInsets.only(bottom: 8),
                child: ListTile(
                  leading: CircleAvatar(
                    child: Icon(icon),
                  ),
                  title: Text(text),
                  trailing: const Icon(Icons.chevron_right),
                ),
              );
            }
          }

          // ============================================================
          // CONTENT
          // ============================================================

          class ContentPage extends StatelessWidget {
            const ContentPage({super.key});

            @override
            Widget build(BuildContext context) {
              final items = [
                ('Posts', Icons.photo_library),
                ('Stories', Icons.auto_stories),
                ('Reels', Icons.video_library),
                ('Collage', Icons.collections),
                ('Highlights', Icons.star),
                ('Planner', Icons.calendar_month),
                ('Approval', Icons.check_circle),
                ('Drafts', Icons.drafts),
              ];

              return CustomScrollView(
                slivers: [
                  const SliverAppBar.large(
                    title: Text('Content Manager'),
                  ),
                  SliverPadding(
                    padding: const EdgeInsets.all(16),
                    sliver: SliverList(
                      delegate: SliverChildBuilderDelegate(
                        (context, i) {
                          return Card(
                            margin: const EdgeInsets.only(bottom: 10),
                            child: ListTile(
                              leading: CircleAvatar(
                                child: Icon(items[i].$2),
                              ),
                              title: Text(items[i].$1),
                              subtitle: Text(
                                _description(items[i].$1),
                              ),
                              trailing: const Icon(Icons.chevron_right),
                              onTap: () {
                                Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => FeaturePage(
                                      title: items[i].$1,
                                      icon: items[i].$2,
                                    ),
                                  ),
                                );
                              },
                            ),
                          );
                        },
                        childCount: items.length,
                      ),
                    ),
                  ),
                ],
              );
            }

            String _description(String name) {
              switch (name) {
                case 'Posts':
                  return 'Choose photos and prepare posts';
                case 'Stories':
                  return 'Create Instagram Story sequences';
                case 'Reels':
                  return 'Plan short-form video content';
                case 'Collage':
                  return 'Combine multiple photos';
                case 'Highlights':
                  return 'Organize profile Highlights';
                case 'Planner':
                  return 'Plan upcoming content';
                case 'Approval':
                  return 'Review content before posting';
                default:
                  return 'Keep unfinished content';
              }
            }
          }

          // ============================================================
          // REAL PHOTO WORKSPACE
          // ============================================================

          class PhotoWorkspace extends StatefulWidget {
            final String mode;

            const PhotoWorkspace({
              super.key,
              required this.mode,
            });

            @override
            State<PhotoWorkspace> createState() => _PhotoWorkspaceState();
          }

          class _PhotoWorkspaceState extends State<PhotoWorkspace> {
            final ImagePicker picker = ImagePicker();

            List<XFile> photos = [];
            String caption = '';
            String music = 'GM will suggest music';
            String aesthetic = 'Natural • Premium • Clean';
            bool approved = false;

            Future<void> addPhotos() async {
              List<XFile> selected;

              if (widget.mode == 'Collage') {
                selected = await picker.pickMultiImage(
                  imageQuality: 95,
                );
              } else {
                final image = await picker.pickImage(
                  source: ImageSource.gallery,
                  imageQuality: 95,
                );

                selected = image == null ? [] : [image];
              }

              if (selected.isEmpty) return;

              setState(() {
                photos.addAll(selected);
              });
            }

            Future<void> takePhoto() async {
              final image = await picker.pickImage(
                source: ImageSource.camera,
                imageQuality: 95,
              );

              if (image == null) return;

              setState(() {
                photos.add(image);
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: Text(widget.mode),
                  actions: [
                    IconButton(
                      onPressed: () {
                        setState(() => approved = !approved);
                      },
                      icon: Icon(
                        approved
                            ? Icons.check_circle
                            : Icons.check_circle_outline,
                      ),
                    ),
                  ],
                ),
                body: ListView(
                  padding: const EdgeInsets.all(16),
                  children: [
                    if (photos.isEmpty)
                      _empty()
                    else
                      _photoArea(),
                    const SizedBox(height: 16),
                    Row(
                      children: [
                        Expanded(
                          child: FilledButton.icon(
                            onPressed: addPhotos,
                            icon: const Icon(
                              Icons.photo_library,
                            ),
                            label: Text(
                              widget.mode == 'Collage'
                                  ? 'Add Photos'
                                  : 'Add Photo',
                            ),
                          ),
                        ),
                        const SizedBox(width: 10),
                        IconButton.filledTonal(
                          onPressed: takePhoto,
                          icon: const Icon(Icons.camera_alt),
                        ),
                      ],
                    ),
                    const SizedBox(height: 22),
                    _settings(),
                    const SizedBox(height: 22),
                    _suggestions(),
                    const SizedBox(height: 22),
                    FilledButton.icon(
                      onPressed: () {
                        ScaffoldMessenger.of(context).showSnackBar(
                          const SnackBar(
                            content: Text(
                              'Content saved for approval.',
                            ),
                          ),
                        );
                      },
                      icon: Icon(
                        approved
                            ? Icons.check
                            : Icons.pending_actions,
                      ),
                      label: Text(
                        approved
                            ? 'Approved'
                            : 'Send for Approval',
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _empty() {
              return Container(
                height: 300,
                decoration: BoxDecoration(
                  borderRadius: BorderRadius.circular(20),
                  border: Border.all(
                    color: Colors.white24,
                  ),
                ),
                child: const Column(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Icon(
                      Icons.add_photo_alternate_outlined,
                      size: 65,
                    ),
                    SizedBox(height: 15),
                    Text(
                      'Add your photo',
                      style: TextStyle(
                        fontSize: 21,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    SizedBox(height: 6),
                    Text(
                      'Choose from Gallery or use Camera',
                    ),
                  ],
                ),
              );
            }

            Widget _photoArea() {
              if (widget.mode == 'Collage') {
                return GridView.builder(
                  shrinkWrap: true,
                  physics: const NeverScrollableScrollPhysics(),
                  itemCount: photos.length,
                  gridDelegate:
                      const SliverGridDelegateWithFixedCrossAxisCount(
                    crossAxisCount: 2,
                    crossAxisSpacing: 6,
                    mainAxisSpacing: 6,
                  ),
                  itemBuilder: (_, i) {
                    return ClipRRect(
                      borderRadius: BorderRadius.circular(12),
                      child: Image.file(
                        File(photos[i].path),
                        fit: BoxFit.cover,
                      ),
                    );
                  },
                );
              }

              return ClipRRect(
                borderRadius: BorderRadius.circular(20),
                child: Image.file(
                  File(photos.first.path),
                  height: 360,
                  fit: BoxFit.cover,
                ),
              );
            }

            Widget _settings() {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Content Details',
                    style: TextStyle(
                      fontSize: 21,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 10),
                  Card(
                    child: Column(
                      children: [
                        ListTile(
                          leading: const Icon(Icons.palette),
                          title: const Text('Aesthetic'),
                          subtitle: Text(aesthetic),
                          trailing: const Icon(Icons.chevron_right),
                        ),
                        ListTile(
                          leading: const Icon(Icons.music_note),
                          title: const Text('Music'),
                          subtitle: Text(music),
                          trailing: const Icon(Icons.chevron_right),
                        ),
                        ListTile(
                          leading: const Icon(Icons.schedule),
                          title: const Text('Posting Time'),
                          subtitle: const Text(
                            'GM will recommend the best time',
                          ),
                          trailing: const Icon(Icons.chevron_right),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 10),
                  TextField(
                    maxLines: 4,
                    decoration: const InputDecoration(
                      labelText: 'Caption',
                      hintText: 'Write your caption...',
                      border: OutlineInputBorder(),
                    ),
                    onChanged: (v) {
                      caption = v;
                    },
                  ),
                ],
              );
            }

            Widget _suggestions() {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(18),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: const [
                      Row(
                        children: [
                          Icon(Icons.auto_awesome, color: gmGreen),
                          SizedBox(width: 8),
                          Text(
                            'GM Suggestions',
                            style: TextStyle(
                              fontSize: 18,
                              fontWeight: FontWeight.bold,
                            ),
                          ),
                        ],
                      ),
                      SizedBox(height: 12),
                      Text(
                        'Best photo: Based on composition and presentation.',
                      ),
                      SizedBox(height: 8),
                      Text(
                        'Pose: Keep the pose natural and authentic.',
                      ),
                      SizedBox(height: 8),
                      Text(
                        'Edit: Premium, clean and not over-edited.',
                      ),
                      SizedBox(height: 8),
                      Text(
                        'Identity: Preserve face and body structure.',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          // ============================================================
          // FEATURE PAGE
          // ============================================================

          class FeaturePage extends StatelessWidget {
            final String title;
            final IconData icon;

            const FeaturePage({
              super.key,
              required this.title,
              required this.icon,
            });

            @override
            Widget build(BuildContext context) {
              final photoModes = [
                'Posts',
                'Stories',
                'Collage',
              ];

              if (photoModes.contains(title)) {
                return PhotoWorkspace(mode: title);
              }

              return Scaffold(
                appBar: AppBar(
                  title: Text(title),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    CircleAvatar(
                      radius: 48,
                      child: Icon(icon, size: 46),
                    ),
                    const SizedBox(height: 20),
                    Text(
                      title,
                      textAlign: TextAlign.center,
                      style: const TextStyle(
                        fontSize: 28,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 10),
                    Text(
                      _info(),
                      textAlign: TextAlign.center,
                    ),
                    const SizedBox(height: 30),
                    _actions(context),
                  ],
                ),
              );
            }

            String _info() {
              switch (title) {
                case 'Highlights':
                  return 'Organize your Instagram profile Highlights '
                      'into clean categories.';
                case 'Planner':
                  return 'Plan posts, Stories and other content '
                      'before publishing.';
                case 'Analytics':
                  return 'Review content performance and identify '
                      'what works best.';
                case 'Approval':
                  return 'GM prepares content but you keep final '
                      'approval before posting.';
                case 'Photo Studio':
                  return 'Prepare natural, premium-looking photos '
                      'without changing identity.';
                default:
                  return 'GM Manager workspace.';
              }
            }

            Widget _actions(BuildContext context) {
              return Column(
                children: [
                  FilledButton.icon(
                    onPressed: () {
                      ScaffoldMessenger.of(context).showSnackBar(
                        SnackBar(
                          content: Text(
                            '$title workspace ready',
                          ),
                        ),
                      );
                    },
                    icon: const Icon(Icons.add),
                    label: const Text('Create New'),
                  ),
                  const SizedBox(height: 10),
                  OutlinedButton.icon(
                    onPressed: () {},
                    icon: const Icon(Icons.folder_open),
                    label: const Text('Open Workspace'),
                  ),
                ],
              );
            }
          }

          // ============================================================
          // GM AI
          // ============================================================

          class AssistantPage extends StatefulWidget {
            const AssistantPage({super.key});

            @override
            State<AssistantPage> createState() => _AssistantPageState();
          }

          class _AssistantPageState extends State<AssistantPage> {
            final controller = TextEditingController();

            final messages = <String>[
              'GM: Hi. I am your personal GM Manager.',
              'GM: I can help with photos, captions, Stories, '
                  'Collages, Highlights, planning and content strategy.',
            ];

            void send() {
              final text = controller.text.trim();

              if (text.isEmpty) return;

              setState(() {
                messages.add('You: $text');
                messages.add(reply(text));
                controller.clear();
              });
            }

            String reply(String value) {
              final text = value.toLowerCase();

              if (text.contains('caption')) {
                return 'GM: I recommend a short, natural caption that '
                    'matches the photo instead of sounding generated.';
              }

              if (text.contains('music')) {
                return 'GM: I can suggest music based on the mood, '
                    'visual style and type of content.';
              }

              if (text.contains('story')) {
                return 'GM: Story plan: strong opening → main moment → '
                    'personal detail → simple closing.';
              }

              if (text.contains('photo')) {
                return 'GM: Add 2–3 photos in Posts and GM can help '
                    'compare composition, lighting and presentation.';
              }

              if (text.contains('post')) {
                return 'GM: I can help choose the strongest photo, '
                    'caption, aesthetic, music and posting strategy.';
              }

              return 'GM: Understood. Tell me what you want to create, '
                  'improve or plan.';
            }

            @override
            void dispose() {
              controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('GM AI'),
                ),
                body: Column(
                  children: [
                    Expanded(
                      child: ListView.builder(
                        padding: const EdgeInsets.all(14),
                        itemCount: messages.length,
                        itemBuilder: (_, i) {
                          final mine =
                              messages[i].startsWith('You:');

                          return Align(
                            alignment: mine
                                ? Alignment.centerRight
                                : Alignment.centerLeft,
                            child: Card(
                              child: Padding(
                                padding: const EdgeInsets.all(14),
                                child: Text(messages[i]),
                              ),
                            ),
                          );
                        },
                      ),
                    ),
                    SafeArea(
                      child: Padding(
                        padding: const EdgeInsets.all(10),
                        child: Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: controller,
                                onSubmitted: (_) => send(),
                                decoration: const InputDecoration(
                                  hintText: 'Ask GM...',
                                  border: OutlineInputBorder(),
                                ),
                              ),
                            ),
                            const SizedBox(width: 8),
                            IconButton.filled(
                              onPressed: send,
                              icon: const Icon(Icons.send),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          // ============================================================
          // TOOLS
          // ============================================================

          class ToolsPage extends StatelessWidget {
            const ToolsPage({super.key});

            @override
            Widget build(BuildContext context) {
              final tools = [
                ('Photo Studio', Icons.photo_camera),
                ('Best Photo', Icons.photo),
                ('Natural Pose', Icons.accessibility_new),
                ('Aesthetic', Icons.palette),
                ('Caption Studio', Icons.edit),
                ('Music', Icons.music_note),
                ('Posting Time', Icons.schedule),
                ('Collage', Icons.collections),
                ('Stories', Icons.auto_stories),
                ('Highlights', Icons.star),
                ('Planner', Icons.calendar_month),
                ('Analytics', Icons.analytics),
              ];

              return CustomScrollView(
                slivers: [
                  const SliverAppBar.large(
                    title: Text('GM Tools'),
                  ),
                  SliverPadding(
                    padding: const EdgeInsets.all(16),
                    sliver: SliverGrid(
                      delegate: SliverChildBuilderDelegate(
                        (context, i) {
                          return Card(
                            child: InkWell(
                              borderRadius: BorderRadius.circular(18),
                              onTap: () {
                                if (tools[i].$1 == 'Collage' ||
                                    tools[i].$1 == 'Stories') {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                      builder: (_) => PhotoWorkspace(
                                        mode: tools[i].$1,
                                      ),
                                    ),
                                  );
                                } else {
                                  Navigator.push(
                                    context,
                                    MaterialPageRoute(
                                      builder: (_) => FeaturePage(
                                        title: tools[i].$1,
                                        icon: tools[i].$2,
                                      ),
                                    ),
                                  );
                                }
                              },
                              child: Column(
                                mainAxisAlignment:
                                    MainAxisAlignment.center,
                                children: [
                                  Icon(tools[i].$2, size: 34),
                                  const SizedBox(height: 10),
                                  Text(
                                    tools[i].$1,
                                    textAlign: TextAlign.center,
                                    style: const TextStyle(
                                      fontWeight: FontWeight.bold,
                                    ),
                                  ),
                                ],
                              ),
                            ),
                          );
                        },
                        childCount: tools.length,
                      ),
                      gridDelegate:
                          const SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: 2,
                        crossAxisSpacing: 12,
                        mainAxisSpacing: 12,
                        childAspectRatio: 1.15,
                      ),
                    ),
                  ),
                ],
              );
            }
          }

