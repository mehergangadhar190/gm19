                          value: approval,
                          onChanged: (v) {
                            setState(() => approval = v);
                          },
                        ),
                        SwitchListTile(
                          title: const Text('Natural Appearance'),
                          subtitle: const Text(
                            'Preserve face and body structure',
                          ),
                          value: naturalMode,
                          onChanged: (v) {
