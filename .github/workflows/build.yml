name: GM Manager Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Create Flutter project
        run: |
          flutter create --platforms=android --org com.gmmanager gmmanager

      - name: Remove default test
        run: |
          rm -rf gmmanager/test

      - name: Copy GM Manager code
        run: |
          mkdir -p gmmanager/lib
          cp lib/main.dart gmmanager/lib/main.dart

      - name: Get packages
        working-directory: gmmanager
        run: flutter pub get

      - name: Analyze
        working-directory: gmmanager
        run: flutter analyze

      - name: Build APK
        working-directory: gmmanager
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-Manager-APK
          path: gmmanager/build/app/outputs/flutter-apk/app-release.apk
