          DART

      - name: Get dependencies
        working-directory: gmmanager
        run: flutter pub get

      - name: Analyze
        working-directory: gmmanager
        run: flutter analyze

      - name: Build release APK
        working-directory: gmmanager
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f gmmanager/build/app/outputs/flutter-apk/app-release.apk
          ls -lh gmmanager/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload GM Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: GM-Manager-Final-APK
          path: gmmanager/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
